<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Adulis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --card:#f2f3f5; --ink:#1c1e21; --muted:#7c838c;
    --accent:#2481cc; --accent-soft:#e6f0fb; --ok:#1e9e5a; --ok-soft:#e3f6ec;
    --warn:#c07c0a; --warn-soft:#fbf1dd; --out:#8a9099; --out-soft:#eceef0;
    --edge:#e3e5e8;
  }
  /* Complete dark palette — applied when Telegram declares dark mode so a
     partial themeParams set can never mix dark backgrounds with dark text. */
  :root.dark{
    --bg:#17212b; --card:#1c2733; --ink:#f5f7fa; --muted:#8fa3b3;
    --ok:#5ec38f; --ok-soft:#16301f;
    --warn:#e0a84a; --warn-soft:#33290f;
    --out:#93a1ad; --out-soft:#26313c;
    --edge:#2a3a4a; --accent-soft:rgba(64,140,204,0.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
  .hgroup{flex:1;min-width:0}
  h1{font-size:19px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;flex:none}
  .lang button{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:6px 9px;cursor:pointer;font-family:inherit}
  .lang button.on{background:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .item{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .item.out{opacity:.55}
  /* Square photo that works on OLD WebViews too: padding-top box + absolute img. */
  .ph{position:relative;width:100%;padding-top:100%;overflow:hidden;background:var(--edge)}
  .ph .emo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px}
  .ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
  .info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .name{font-size:13.5px;font-weight:600;line-height:1.3;min-height:2.6em}
  .pricerow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .price{font-size:15px;font-weight:700}
  .neg{font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:8px;font-weight:600}
  .tier{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;align-self:flex-start}
  .t-in{color:var(--ok);background:var(--ok-soft)} .t-low{color:var(--warn);background:var(--warn-soft)} .t-out{color:var(--out);background:var(--out-soft)}
  .buy{margin-top:auto;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .buy:active{transform:scale(.97)}
  .buy:disabled{background:var(--out-soft);color:var(--out);cursor:default}
  .state{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
  .state button{margin-top:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .spin{width:34px;height:34px;border:3px solid var(--edge);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:r 0.8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:28px 0 6px}
  footer b{color:var(--accent)}
  /* --- owner panel + create form --- */
  .panel{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .panel h2{font-size:16px}
  .panel .note{font-size:12.5px;color:var(--muted);line-height:1.5}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px 2px}
  .field input{width:100%;border:1px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;padding:11px 12px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;display:block}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn:disabled{opacity:.6;cursor:default}
  .linkbox{background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--accent);word-break:break-all;line-height:1.4}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .err{color:#c0392b;font-size:12.5px;line-height:1.4}
  :root.dark .err{color:#ff9e94}
  .okmsg{color:var(--ok);font-size:13px;font-weight:600}
</style>
</head>
<body>

    <div class="logo">A</div>
    <div class="hgroup">
      <h1 id="storeName">Adulis</h1>
      <div class="sub" id="storeSub"></div>
    </div>
    <div class="lang">
      <button id="langEn" type="button">EN</button>
      <button id="langAm" type="button">አማ</button>
    </div>
  </header>
  <div id="content"><div class="state"><div class="spin"></div></div></div>
  <footer id="footer"></footer>
</div>
<script>
(function(){

  var KEY='sb_publishable_33p448jGnQfTZab7rB9nHw_y6NUkqjy';

  var L={};
  var STR={
    en:{appSub:'Shops inside Telegram', sub:'Browse · negotiate in Telegram', subNoUser:'Browse our items',

        createTitle:'Create your shop', createIntro:'Just name your shop — your Telegram is the login.',

        saveBtn:'Save', credSaved:'Saved! Use this email + password in the Adulis app.',
        created:'Shop created! 🎉', ownerTitle:'My shop',

        posting:'Posting…', posted:'Posted! Check your channel.',

        errHasStore:'You already have a shop — opening it.', errChannel:'Could not post. Make sure @AdulisShopBot is an ADMIN of that channel.',
        errGeneric:'Something went wrong — try again.', signin:'Signing you in…'},
    am:{appSub:'በቴሌግራም ውስጥ ሱቆች', sub:'ይመለከቱ · ዋጋ በቴሌግራም ይደራደሩ', subNoUser:'ዕቃዎችን ይመለከቱ',
        in:'አለ', low:'ጥቂቱ', out:'አልቀረም',
        neg:'ይደራደሩ', buy:'ይደራደሩ', buyOut:'ተሽጧል', buyNoUser:'በውይይት ጠይቁ',
        unavailable:'ይህ ሱቅ አሁን አይገኝም።', retry:'እንደገና ይሞክሩ',
        noslug:'ሱቅ አልተመረጠም። አገናኙን ከሱቁ ይክፈቱ።',
        footer:'ዕቃ ቆጠራ ከ<b>አዱሊስ</b> ጋር በቀጥታ ይታደሳል',
        dm:function(n,p){return 'ሰላም! '+n+' ('+p+') — ዋጋው ይደራደራል?';},
        openBot:'ለመቀጠል @AdulisShopBotን በቴሌግራም ይክፈቱ።',
        createTitle:'ሱቅዎን ይፍጠሩ', createIntro:'የሱቁን ስም ብቻ ይጻፉ — ቴሌግራሙ ቁልፍዎ ነው።',
        shopNameL:'የሱቅ ስም', emailL:'ኢሜይል', passL:'የመግቢያ ቃል (8+ ፊደላት)',
        createBtn:'ሱቄን ይፍጠሩ', creating:'በመፍጠር ላይ…',
        credTitle:'በአዱሊስ መተግበሪያ ይጠቀሙ', credNote:'ኢሜይልዎንና የመግቢያ ቃል አንድ ጊዜ አዘጋጅተው በስልክዎ በሙሉ መተግበሪያው ለመግባት ይጠቀሙ።',
        saveBtn:'አስቀምጥ', credSaved:'ተቀምጧል! ይህን ኢሜይልና ቃል በአዱሊስ መተግበሪያ ይጠቀሙ።',
        created:'ሱቁ ተፈጥሯል! 🎉', ownerTitle:'ሱቄ',
        yourLink:'የሱቁ አገናኝ — በቻናልዎ ይጋሩት፦', openShopBtn:'🛍 ሱቴን ክፈት',
        channelL:'የቻናል ተጠቃሚ ስም (መጀመሪያ @AdulisShopBotን አስተዳዳሪ ያድርጉ)', postBtn:'🛍 ወደ ቻናሌ ላክ',
        posting:'በመላክ ላይ…', posted:'ተልኳል! ቻናልዎን ይመልከቱ።',
        getApp:'ሙሉ የአዱሊስ መተግበሪያ ያውርዱ', getAppNote:'ዕቃ፣ ዋጋና ሽያጭ ከስልክዎ ይቆጣጠሩ — ከኢንተርኔት ውጭ እንኳ።',
        errName:'የሱቅ ስም ያስፈልጋል (ቢያንስ 2 ፊደላት)።', errEmail:'ትክክለኛ ኢሜይል ያስገቡ።',
        errPass:'የመግቢያ ቃል ቢያንስ 8 ፊደላት መሆን አለበት።', errTaken:'ኢሜይሉ ቀድሞ ተመዝግቧል — ሌላ ይጠቀሙ።',
        errHasStore:'ሱቅ ቀድሞ አለዎት — በመክፈት ላይ።', errChannel:'ልክ አልተቻለም። @AdulisShopBot የዚያ ቻናል አስተዳዳሪ መሆኑን ያረጋግጡ።',
        errGeneric:'ችግር አጋጥሟል — እንደገና ይሞክሩ።', signin:'በማስገባት ላይ…'}
  };
  function detectLang(){
    try{ if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){
      var lc=tg.initDataUnsafe.user.language_code||'';
      if(lc.indexOf('am')===0) return 'am'; } }catch(e){}
    var nl=(navigator.language||'en').toLowerCase();
    return nl.indexOf('am')===0?'am':'en';
  }
  function setLang(l){
    L=STR[l]||STR.en;
    try{localStorage.setItem('adulis_lang',l);}catch(e){}
    document.getElementById('langEn').className=l==='en'?'on':'';
    document.getElementById('langAm').className=l==='am'?'on':'';
    document.getElementById('footer').innerHTML=L.footer;
    if(window.__mode) route();
  }
  var saved='en';
  try{saved=localStorage.getItem('adulis_lang')||detectLang();}catch(e){saved=detectLang();}
  document.getElementById('langEn').onclick=function(){setLang('en');};
  document.getElementById('langAm').onclick=function(){setLang('am');};

  // Adopt Telegram's theme when opened as a mini app. colorScheme is the
  // MASTER switch (complete palette per mode); themeParams refine on top —
  // a partial param set can never break contrast again.
  try{ if(tg&&tg.initData!==undefined){
    if(tg.colorScheme==='dark') document.documentElement.classList.add('dark');
    var tp=tg.themeParams||{}; var r=document.documentElement.style;
    var map={bg_color:'--bg',secondary_bg_color:'--card',text_color:'--ink',
      hint_color:'--muted',button_color:'--accent'};
    for(var k in map){ if(map[k]&&tp[k]) r.setProperty(map[k],'#'+tp[k]); }
    if(tp.button_color) r.setProperty('--accent-soft','rgba(64,140,204,0.18)');
    tg.ready(); tg.expand&&tg.expand();
  }}catch(e){}

  function money(n){return Number(n).toLocaleString('en-US')+' ETB';}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function content(){return document.getElementById('content');}
  function openTg(u){
    try{ if(tg&&tg.openTelegramLink){tg.openTelegramLink(u);return;} }catch(e){}
    window.open(u,'_blank');
  }

  // =====================================================================
  // SHOP MODE (?s=slug) — the customer storefront (unchanged behavior)
  // =====================================================================
  window.__rows=null;
  function renderShop(rows){
    var c=content(); c.innerHTML='';
    if(!rows||!rows.length){
      c.appendChild(el('div','state',L.unavailable));return;
    }
    window.__rows=rows;
    var store=rows[0], user=store.telegram_username;
    document.getElementById('storeName').textContent=store.store_name||'Shop';
    document.getElementById('storeSub').textContent = user?L.sub:L.subNoUser;
    document.title=(store.store_name||'Shop')+' · Adulis';
    var g=el('div','grid');
    rows.forEach(function(r){
      var card=el('div','item'+(r.tier==='out'?' out':''));
      var ph=el('div','ph');
      if(r.image_url){var im=document.createElement('img');im.loading='lazy';im.decoding='async';
        im.alt=r.item_name;im.src=r.image_url;im.onerror=function(){im.remove();};ph.appendChild(im);}
      else{ph.appendChild(el('div','emo','🛍️'));}
      var info=el('div','info');
      info.appendChild(el('div','name',r.item_name));
      var pr=el('div','pricerow');
      pr.appendChild(el('span','price',money(r.sell_price)));
      if(r.tier!=='out')pr.appendChild(el('span','neg',L.neg));
      info.appendChild(pr);
      var tierCls={in:'t-in',low:'t-low',out:'t-out'}[r.tier]||'t-in';
      var tierTxt={in:L.in,low:L.low,out:L.out}[r.tier]||L.in;
      info.appendChild(el('span','tier '+tierCls,tierTxt));
      var btn=el('button','buy');
      if(r.tier==='out'){btn.disabled=true;btn.textContent=L.buyOut;}
      else if(!user){btn.disabled=true;btn.textContent=L.buyNoUser;}
      else{btn.textContent=L.buy;
        btn.onclick=function(){
          openTg('https://t.me/'+encodeURIComponent(user)+'?text='+encodeURIComponent(L.dm(r.item_name,money(r.sell_price))));
        };}
      info.appendChild(btn);
      card.appendChild(ph);card.appendChild(info);g.appendChild(card);
    });
    c.appendChild(g);
  }
  function loadShop(){
    fetch(API+'/rest/v1/rpc/public_storefront_items',{
      method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_slug:slug})
    }).then(function(r){return r.ok?r.json():Promise.reject();})
      .then(renderShop)
      .catch(function(){
        var c=content();c.innerHTML='';
        var s=el('div','state',L.errGeneric||'Could not load.');
        var b=el('button',null,L.retry);b.onclick=location.reload;
        s.appendChild(document.createElement('br'));s.appendChild(b);c.appendChild(s);
      });
  }

  // =====================================================================
  // OWNER MODES (?mode=home / ?mode=create) — merchant panel
  // =====================================================================
  function initDataOK(){ return !!(tg&&tg.initData&&tg.initData.length); }
  function exchangeToken(tokenHash){
    return fetch(API+'/auth/v1/verify',{
      method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({type:'magiclink',token_hash:tokenHash,redirect_to:BASE})
    }).then(function(r){return r.ok?r.json():Promise.reject();});
  }
  function authCall(action,body){
    return fetch(AUTHFN,{method:'POST',
      headers:Object.assign({'Content-Type':'application/json','apikey':KEY},
        session?{Authorization:'Bearer '+session}:{}),
      body:JSON.stringify(Object.assign({action:action},body||{}))
    }).then(function(r){return r.json().then(function(j){j._status=r.status;return j;});});
  }

  function needBotHint(p){
    p.appendChild(el('div','note',L.openBot));
    var b=el('a','btn ghost','@AdulisShopBot');
    b.href='https://t.me/AdulisShopBot';
    p.appendChild(b);
  }

  function renderCreate(errMsg){
    window.__mode='create';
    var c=content();c.innerHTML='';
    document.getElementById('storeName').textContent=L.createTitle;
    document.getElementById('storeSub').textContent=L.appSub;
    var p=el('div','panel');
    p.appendChild(el('h2',null,L.createTitle));
    p.appendChild(el('div','note',L.createIntro));
    if(!initDataOK()) needBotHint(p);
    var f1=el('div','field');f1.appendChild(el('label',null,L.shopNameL));
    var iName=document.createElement('input');iName.maxLength=60;iName.placeholder='…';f1.appendChild(iName);
    var err=el('div','err',errMsg||'');
    var btn=el('button','btn',L.createBtn);
    btn.disabled=!initDataOK();
    btn.onclick=function(){
      err.textContent='';
      var name=iName.value.trim();
      if(name.length<2){err.textContent=L.errName;return;}
      btn.disabled=true;btn.textContent=L.creating;
      authCall('signup',{initData:tg.initData,shopName:name})
        .then(function(j){
          if(j.ok&&j.token_hash){
            return exchangeToken(j.token_hash).then(function(s){
              session=s.access_token;
              renderOwner({name:name,slug:j.slug},true);
            });
          }
          if(j.error==='already_has_store'){err.textContent=L.errHasStore;
            setTimeout(function(){location.href=BASE+'?mode=home';},900);return;}
          throw new Error(j.error||'x');
        })
        .catch(function(){err.textContent=L.errGeneric;})
        .then(function(){btn.disabled=false;btn.textContent=L.createBtn;});
    };
    p.appendChild(f1);p.appendChild(err);p.appendChild(btn);
    c.appendChild(p);
  }

  function renderOwner(store,fresh){
    window.__mode='owner';
    var c=content();c.innerHTML='';
    document.getElementById('storeName').textContent=store.name;
    document.getElementById('storeSub').textContent=L.ownerTitle+' · '+L.appSub;
    var p=el('div','panel');
    if(fresh)p.appendChild(el('div','okmsg',L.created));
    p.appendChild(el('h2',null,store.name));
    p.appendChild(el('div','note',L.yourLink));
    p.appendChild(el('div','linkbox',BASE+'?s='+store.slug));
    var row=el('div','row');
    var bCopy=el('button','btn ghost',detectCur()==='am'?'ቅዳ':'Copy');
    bCopy.onclick=function(){
      var t=BASE+'?s='+store.slug;
      try{navigator.clipboard.writeText(t);}catch(e){}
      bCopy.textContent='✓';
      setTimeout(function(){bCopy.textContent=detectCur()==='am'?'ቅዳ':'Copy';},1200);
    };
    var bOpen=el('a','btn',L.openShopBtn);
    bOpen.href=BASE+'?s='+store.slug;
    row.appendChild(bCopy);row.appendChild(bOpen);
    p.appendChild(row);

    var fc=el('div','field');fc.appendChild(el('label',null,L.channelL));
    var iCh=document.createElement('input');iCh.placeholder='@myshopchannel';
    if(store.channel)iCh.value='@'+store.channel;
    fc.appendChild(iCh);
    var err=el('div','err');
    var bPost=el('button','btn',L.postBtn);
    bPost.onclick=function(){
      err.textContent='';
      var ch=iCh.value.trim().replace(/^@/,'');
      if(!ch){err.textContent=L.errChannel;return;}
      bPost.disabled=true;bPost.textContent=L.posting;
      authCall('post_channel',{channel:ch})
        .then(function(j){
          if(j.ok){err.textContent='';bPost.textContent=L.posted;}
          else{err.textContent=L.errChannel;bPost.textContent=L.postBtn;}
          bPost.disabled=false;
        })
        .catch(function(){err.textContent=L.errGeneric;bPost.disabled=false;bPost.textContent=L.postBtn;});
    };
    p.appendChild(fc);p.appendChild(bPost);p.appendChild(err);

    var gap=el('div');gap.style.height='6px';p.appendChild(gap);
    // One-time APK bridge: set email+password while holding the
    // Telegram-signed session.
    p.appendChild(el('h2',null,L.credTitle));
    p.appendChild(el('div','note',L.credNote));
    var fe=el('div','field');fe.appendChild(el('label',null,L.emailL));
    var iEm=document.createElement('input');iEm.type='email';iEm.autocomplete='off';fe.appendChild(iEm);
    var fp=el('div','field');fp.appendChild(el('label',null,L.passL));
    var iPw=document.createElement('input');iPw.type='password';iPw.autocomplete='new-password';fp.appendChild(iPw);
    var cerr=el('div','err');
    var cmsg=el('div','okmsg');
    var bSave=el('button','btn',L.saveBtn);
    bSave.onclick=function(){
      cerr.textContent='';cmsg.textContent='';
      var em=iEm.value.trim(),pw=iPw.value;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){cerr.textContent=L.errEmail;return;}
      if(pw.length<8){cerr.textContent=L.errPass;return;}
      bSave.disabled=true;
      authCall('set_credentials',{email:em,password:pw})
        .then(function(j){
          if(j.ok){cmsg.textContent=L.credSaved;iPw.value='';}
          else if(j.error==='email_taken'){cerr.textContent=L.errTaken;}
          else{cerr.textContent=L.errGeneric;}
        })
        .catch(function(){cerr.textContent=L.errGeneric;})
        .then(function(){bSave.disabled=false;});
    };
    p.appendChild(fe);p.appendChild(fp);p.appendChild(cerr);p.appendChild(cmsg);p.appendChild(bSave);

    var gap2=el('div');gap2.style.height='6px';p.appendChild(gap2);
    p.appendChild(el('div','note',L.getAppNote));
    var bApk=el('a','btn ghost',L.getApp);bApk.href=APK;bApk.target='_blank';
    p.appendChild(bApk);
    c.appendChild(p);
  }
  function detectCur(){return document.getElementById('langAm').className.indexOf('on')>=0?'am':'en';}

  function renderHome(){
    window.__mode='home';
    var c=content();c.innerHTML='';
    if(!initDataOK()){
      document.getElementById('storeName').textContent='Adulis';
      document.getElementById('storeSub').textContent=L.appSub;
      renderCreate();return;
    }
    c.appendChild(el('div','state',L.signin));
    authCall('signin',{initData:tg.initData})
      .then(function(j){
        if(j.needsSignup){renderCreate();return;}
        if(!j.ok||!j.token_hash) throw new Error('x');
        return exchangeToken(j.token_hash).then(function(s){
          session=s.access_token;
          renderOwner({name:j.name,slug:j.slug});
        });
      })
      .catch(function(){
        var cc=content();cc.innerHTML='';
        var st=el('div','state',L.errGeneric);
        var b=el('button',null,L.retry);b.onclick=location.reload;
        st.appendChild(document.createElement('br'));st.appendChild(b);cc.appendChild(st);
      });
  }

  // ---- Routing ----
  function route(){
    if(slug){document.getElementById('storeName').textContent='…';loadShop();}
    else if(mode==='create'){renderCreate();}
    else if(mode==='home'){renderHome();}
    else{renderHome();}
  }
  setLang(saved);
  route();
})();
</script>
</body>
</html>
