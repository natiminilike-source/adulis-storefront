<!DOCTYPE html>

<style>
  :root{
    --bg:#ffffff; --card:#f2f3f5; --ink:#1c1e21; --muted:#7c838c;
    --accent:#2481cc; --accent-soft:#e6f0fb; --ok:#1e9e5a; --ok-soft:#e3f6ec;
    --warn:#c07c0a; --warn-soft:#fbf1dd; --out:#8a9099; --out-soft:#eceef0;
    --edge:#e3e5e8;
  }
  /* Complete dark palette — applied when Telegram declares dark mode.
     We deliberately do NOT copy Telegram's themeParams: partial or
     low-contrast sets caused invisible buttons/text on real phones. Our
     two complete palettes guarantee contrast; Telegram's mode is the
     only signal we take from the host. */
  :root.dark{
    --bg:#17212b; --card:#1c2733; --ink:#f5f7fa; --muted:#8fa3b3;
    --accent:#4aa3ec;
    --ok:#5ec38f; --ok-soft:#16301f;
    --warn:#e0a84a; --warn-soft:#33290f;
    --out:#93a1ad; --out-soft:#26313c;
    --edge:#2a3a4a; --accent-soft:rgba(74,163,236,0.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
  header{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .hgroup{flex:1;min-width:0}
  h1{font-size:22px;line-height:1.2;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;flex:none}
  .lang button{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700;padding:6px 9px;cursor:pointer;font-family:inherit}
  .lang button.on{background:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .item{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .item.out{opacity:.55}
  /* Square photo that works on OLD WebViews too: padding-top box + absolute img. */
  .ph{position:relative;width:100%;padding-top:100%;overflow:hidden;background:var(--edge)}
  .ph .emo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px}
  .ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
  .info{padding:10px 11px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .name{font-size:13.5px;font-weight:600;line-height:1.3;min-height:2.6em}
  .pricerow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .price{font-size:17px;font-weight:800;color:var(--ok)}
  .neg{font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:8px;font-weight:600}
  .tier{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;align-self:flex-start}
  .t-in{color:var(--ok);background:var(--ok-soft)} .t-low{color:var(--warn);background:var(--warn-soft)} .t-out{color:var(--out);background:var(--out-soft)}
  .buy{margin-top:auto;background:var(--accent);color:#fff;border:none;border-radius:22px;padding:12px 10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  .buy:active{transform:scale(.97)}
  .buy:disabled{background:var(--out-soft);color:var(--out);cursor:default}
  .state{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
  .state button{margin-top:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .spin{width:34px;height:34px;border:3px solid var(--edge);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:r 0.8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--muted);font-size:11px;padding:28px 0 6px}
  footer b{color:var(--accent)}
  /* --- owner panel + create form --- */
  .panel{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .panel h2{font-size:16px}
  .panel .note{font-size:12.5px;color:var(--muted);line-height:1.5;white-space:pre-line}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px 2px}
  .field input{width:100%;border:1px solid var(--edge);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;padding:11px 12px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;display:block}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn:disabled{opacity:.6;cursor:default}
  .linkbox{background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--accent);word-break:break-all;line-height:1.4}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .err{color:#c0392b;font-size:12.5px;line-height:1.4}
  :root.dark .err{color:#ff9e94}
  .okmsg{color:var(--ok);font-size:13px;font-weight:600}
  /* --- owner items + sheets --- */
  .sect{margin-top:14px}
  .sect h3{font-size:13px;color:var(--muted);margin:0 0 6px 2px;font-weight:700}
  .item-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--edge)}
  .item-row:last-child{border-bottom:none}
  .item-row .thumb{width:38px;height:38px;border-radius:8px;background:var(--edge);flex:none;object-fit:cover;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px}
  .item-row .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ir-main{flex:1;min-width:0}
  .ir-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ir-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ir-btns{display:flex;flex-direction:column;gap:4px;flex:none}
  .mbtn{border:1px solid var(--edge);background:var(--bg);color:var(--ink);border-radius:9px;font-size:13px;font-weight:700;padding:12px 10px;cursor:pointer;font-family:inherit}
  .mbtn:active{transform:scale(.97)}
  .mbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mbtn.warn{color:#c0392b;border-color:#c0392b33}
  .szline{display:flex;align-items:center;gap:6px;margin-top:6px}
  .szline input{width:64px;border:1px solid var(--edge);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;padding:7px 8px;font-family:inherit;outline:none;text-align:center}
  .szline input:focus{border-color:var(--accent)}
  .szdel{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
  .toggle input{width:18px;height:18px;accent-color:var(--accent)}
  .hotline{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--edge)}
  .hotline:last-child{border-bottom:none}
  .s-thumb{width:40px;height:40px;border-radius:8px;background:var(--edge);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:15px}
  .s-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .hl-main{flex:1;min-width:0;font-size:12.5px}
  .hl-right{text-align:right;flex:none}
  .hl-right b{font-weight:700;display:block;font-size:12.5px}
  .hl-right span{color:var(--muted);font-size:10.5px}
  .funnel{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .panel h2{font-size:18px}
  .back{margin-bottom:10px}
  /* --- item cards (APK-products-like spacing, big touch targets) --- */
  .item-card{background:var(--bg);border:1px solid var(--edge);border-radius:12px;padding:12px;margin-bottom:12px}
  .ic-top{display:flex;gap:12px;align-items:flex-start}
  .ic-thumb{width:110px;height:110px;border-radius:10px;background:var(--edge);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
  .ic-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ic-main{flex:1;min-width:0;padding-top:2px}
  .ic-name{font-size:16px;font-weight:700;line-height:1.3}
  .ic-sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ic-btns{display:flex;gap:8px;margin-top:11px}
  .ic-btns .mbtn{flex:1;padding:12px 4px;font-size:13px;border-radius:9px}
  .ph-pick{display:flex;align-items:center;gap:10px;margin-top:4px}
  .ph-prev{width:54px;height:54px;border-radius:9px;background:var(--edge);overflow:hidden;flex:none}
  .ph-prev img{width:100%;height:100%;object-fit:cover;display:block}
  /* --- owner tab bar (three tabs max — analysis-paralysis rule) --- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;
    background:var(--card);border-top:1px solid var(--edge);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:50;
    box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  .tabbtn{flex:1;border:none;background:transparent;color:var(--muted);
    font-size:11px;font-weight:700;padding:9px 2px;border-radius:12px;
    cursor:pointer;font-family:inherit;white-space:nowrap;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbtn svg{display:block}
  .tabbtn.on{background:var(--accent-soft);color:var(--accent)}
  .tabbtn:active{transform:scale(.97)}
  /* --- shopper cart --- */
  .addbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;
    border:none;background:var(--accent);color:#fff;font-size:20px;font-weight:700;
    cursor:pointer;font-family:inherit;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center}
  .addbtn:active{transform:scale(.92)}
  .addbtn.done{background:var(--ok)}
  .cartfab{position:fixed;right:14px;bottom:16px;z-index:60;border:none;cursor:pointer;
    background:var(--accent);color:#fff;border-radius:24px;padding:11px 16px;
    font-size:13px;font-weight:800;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.28);
    display:flex;align-items:center;gap:8px}
  .cartfab:active{transform:scale(.96)}
  .cartrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--edge)}
  .cartrow:last-child{border-bottom:none}
  .cartrow .cr-name{flex:1;min-width:0;font-size:13px}
  .step{display:flex;align-items:center;gap:8px;flex:none}
  .step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);
    background:var(--bg);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;line-height:0}
  .step b{min-width:18px;text-align:center;font-size:14px}
  .carttotal{display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding:12px 0 4px}
  .crx{border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px}
  /* --- Ask assistant chat overlay --- */
  .chat{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column}
  .chat-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--edge);background:var(--card)}
  .chat-hd b{font-size:15px;flex:1}
  .chat-hd span{font-size:10.5px;color:var(--muted);border:1px solid var(--edge);border-radius:7px;padding:2px 6px}
  .chat-x{border:none;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 10px;font-family:inherit}
  .chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:84%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
  .typing{align-self:flex-start;color:var(--muted);font-size:12px;padding:2px 6px}
  .chat-quick{display:flex;gap:6px;padding:8px 14px 4px;flex-wrap:wrap}
  .chat-in{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--edge);background:var(--card)}
  .chat-in input{flex:1;border:1px solid var(--edge);border-radius:20px;background:var(--bg);color:var(--ink);font-size:14px;padding:10px 14px;font-family:inherit;outline:none}
  .chat-in input:focus{border-color:var(--accent)}
  .chat-in button{border:none;background:var(--accent);color:#fff;border-radius:20px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  /* segmented toggle (Best sellers / Not moving / Sales) */
  .seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);
    font-size:12px;font-weight:700;padding:10px 4px;border-radius:9px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--accent);color:#fff}
</style>
</head>

  function detectLang(){

      if(lc.indexOf('am')===0) return 'am'; } }catch(e){}

    document.getElementById('langEn').className=l==='en'?'on':'';
    document.getElementById('langAm').className=l==='am'?'on':'';
    document.getElementById('footer').innerHTML=L.footer;
    // Repaint whatever is on screen in the new language:

    if(window.__rows){renderShop(window.__rows);}

  function errDetail(j){
    var parts=[j.error||''];
    if(j.why)parts.push(j.why);
    if(j.fields&&j.fields.length)parts.push('['+j.fields.join(',')+']');
    if(typeof j.got_len==='number')parts.push('len:'+j.got_len);
    if(j._status)parts.push('HTTP '+j._status);
    if(j._net)parts.push(j._net);
    return parts.filter(Boolean).join(' ');

  // On identity failures: one tap copies the phone's RAW identity string
  // so the exact Telegram payload can be analyzed server-side.
  function diagButton(parent){
    var b=el('button','btn ghost','📋 Copy diagnostics — paste to developer');
    b.style.marginTop='8px';
    b.onclick=function(){
      var blob='ADULIS-DIAG\nurl: '+location.href+'\ninitDataLen: '+((tg&&tg.initData)||'').length+'\ninitData: '+((tg&&tg.initData)||'(empty)')+'\n';
      try{navigator.clipboard.writeText(blob);}catch(e){}

  function exchangeToken(tokenHash){
    // redirect_to deliberately OMITTED: this Supabase auth generation
    // rejects /auth/v1/verify with "Only the token_hash and type should
    // be provided" (HTTP 400) whenever any extra field rides along —
    // the page-side exchange had never worked until that was found.
    return fetch(API+'/auth/v1/verify',{
      method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({type:'magiclink',token_hash:tokenHash})
    }).then(function(r){return r.ok?r.json():Promise.reject();});
  }
  // Take the session out of a server reply: prefer the ready-made
  // access_token (minted server-side), fall back to exchanging the
  // token_hash. Resolves true when `session` is set.
  function takeSession(j){
    if(j&&j.access_token){
      session=j.access_token;
      if(j.needs_credentials!==undefined)window.__needsCreds=j.needs_credentials;
      if(j.telegram_username!==undefined)window.__ownerUsername=j.telegram_username;
      if(j.telegram_channel!==undefined)window.__ownerChannel=j.telegram_channel;
      return Promise.resolve(true);
    }
    if(j&&j.ok&&j.token_hash){
      return exchangeToken(j.token_hash).then(function(s){session=s.access_token;return true;});
    }
    return Promise.resolve(false);
  }
  function authCall(action,body){
    return fetch(AUTHFN,{method:'POST',
      headers:Object.assign({'Content-Type':'application/json','apikey':KEY},
        session?{Authorization:'Bearer '+session}:{}),
      body:JSON.stringify(Object.assign({action:action},body||{}))
    }).then(function(r){return r.json().then(function(j){j._status=r.status;return j;});})
      .catch(function(e){return {_status:0,error:'network',_net:(e&&e.message)||''};});
  }

  // OTP step: this Telegram build's signature couldn't be verified, so the
  // server sent a 6-digit code to the user's own @AdulisShopBot chat —
  // receiving it IS the proof of identity. retry(code) re-runs the original
  // action with the code; onSuccess(j) renders the result exactly as the
  // direct (signature-verified) path would have.
  function renderCodeStep(retry,onSuccess){
    var c=content();c.innerHTML='';
    document.getElementById('storeName').textContent='Adulis';
    document.getElementById('storeSub').textContent=L.appSub;
    setLogo(null);
    var p=el('div','panel');

    f.appendChild(iCode);p.appendChild(f);
    var err=el('div','err');
    var b=el('button','btn',L.verifyBtn);
    b.onclick=function(){
      var code=iCode.value.trim();
      if(!/^\d{6}$/.test(code)){err.textContent=L.errCode;return;}
      b.disabled=true;b.textContent=L.verifying;err.textContent='';
      retry(code).then(function(j){
        if(j.ok&&(j.access_token||j.token_hash)){
          return takeSession(j).then(function(ok){
            if(ok){onSuccess(j);return;}
            throw new Error(j.error||'session');
          });
        }
        b.disabled=false;b.textContent=L.verifyBtn;
        if(j.error==='bad_code'){err.textContent=L.errCode;return;}
        if(j.code_required){err.textContent=L.codeWait;return;}
        if(j.needsSignup){renderCreate();return;}
        err.textContent=L.errGeneric+'  ⓘ '+errDetail(j);
      }).catch(function(){b.disabled=false;b.textContent=L.verifyBtn;err.textContent=L.errGeneric;});
    };
    p.appendChild(b);p.appendChild(err);c.appendChild(p);
    setTimeout(function(){try{iCode.focus();}catch(e){}},50);
  }

  function renderCreate(errMsg){
    window.__mode='create';

    var lastCode='';

      btn.disabled=true;btn.textContent=L.creating;

        .then(function(j){
          lastCode=errDetail(j);
          if(j.ok&&(j.access_token||j.token_hash)){

              if(!ok)throw new Error(j.error||'session');
              renderOwner({name:j.name||name,slug:j.slug},!j.had_store);
            });

          if(j.code_required){

            },function(k){
              renderOwner({name:k.name||name,slug:k.slug},!k.had_store);
            });
            return;
          }
          if(j.error==='already_has_store'){
            // Old-server safety: the fixed server signs straight in for
            // existing stores, but if this reply ever appears, sign in.
            btn.textContent=L.signin;
            return authCall('signin',{initData:tg.initData}).then(function(k){
              if(k.ok&&(k.access_token||k.token_hash)){
                return takeSession(k).then(function(ok){
                  if(ok)renderOwner({name:k.name,slug:k.slug});
                });
              }
              if(k.code_required){
                renderCodeStep(function(code){
                  return authCall('signin',{initData:tg.initData,code:code});
                },function(m){
                  renderOwner({name:m.name,slug:m.slug});
                });
                return;
              }
              throw new Error(k.error||'x');
            });
          }
          throw new Error(j.error||'x');
        })
        .catch(function(e){
          err.textContent=L.errGeneric;
          detail.textContent='ⓘ '+(lastCode||e.message||'network');
          if(/bad_init_data/.test(lastCode))diagButton(p);
        })
        .then(function(){btn.disabled=false;btn.textContent=L.createBtn;});
    };
    p.appendChild(f1);p.appendChild(err);p.appendChild(detail);p.appendChild(btn);
    c.appendChild(p);
  }

  // ---- SALES tab: period chips + segmented sections (APK-style) -------
  function renderSalesTab(p){
    var cur=window.__salesDays||7;

    var periodRow=el('div','ir-sub');periodRow.style.marginBottom='8px';
    var funnelBox=el('div');
    var seg=el('div','seg');
    var bodies={best:el('div'),lag:el('div'),sales:el('div')};
    function showSec(k){
      sec=k;window.__salesSec=k;
      Object.keys(bodies).forEach(function(key){bodies[key].style.display=(key===k)?'':'none';});
      var order=['best','lag','sales'];
      Array.prototype.forEach.call(seg.children,function(x,i){x.classList.toggle('on',order[i]===k);});
    }
    [['best',L.segBest],['lag',L.segLag],['sales',L.segSales]].forEach(function(pair){
      var b=el('button',null,pair[1]);
      b.onclick=function(){showSec(pair[0]);};
      seg.appendChild(b);
    });
    function load(){
      funnelBox.innerHTML='';
      Object.keys(bodies).forEach(function(k){
        bodies[k].innerHTML='';bodies[k].appendChild(el('div','note','…'));
      });
      authCall('sales_history',{days:cur}).then(function(j){
        Object.keys(bodies).forEach(function(k){bodies[k].innerHTML='';});
        if(!j.ok){
          bodies.best.appendChild(el('div','note','ⓘ '+(j.error||'sales')));
          showSec(sec);return;
        }
        var f=j.funnel||{visit:0,negotiate:0,buy:0};
        var soldTotal=(j.sales||[]).reduce(function(a,s){return a+(s.qty||0);},0);
        funnelBox.appendChild(el('div','funnel',L.funnel(f.visit,f.negotiate+f.buy,0,soldTotal)));
        // BEST
        if(j.best&&j.best.length){
          j.best.forEach(function(b){
            bodies.best.appendChild(saleRow(b.img,b.name+' — ×'+b.qty,money(b.amount),''));
          });
        }else{bodies.best.appendChild(el('div','note',L.noSales));}
        // LAGGING
        if(j.worst&&j.worst.length){
          j.worst.forEach(function(w){
            bodies.lag.appendChild(saleRow(w.img||w.image_url,w.name,money(w.sell_price),''));
          });
        }else{bodies.lag.appendChild(el('div','note',L.noneYet));}
        // SALES LIST
        if(j.sales&&j.sales.length){
          j.sales.forEach(function(s){
            bodies.sales.appendChild(saleRow(
              s.img,
              s.name+(s.size?' ('+shortSize(s.size)+')':'')+' ×'+s.qty,
              money(s.amount),
              chLabel(s.channel)+' · '+fmtWhen(s.at)
            ));
          });
        }else{bodies.sales.appendChild(el('div','note',L.noSales));}
        showSec(sec);
      });
    }
    [[7,L.p7],[30,L.p30],['all',L.pall]].forEach(function(pair){
      var b=el('button','mbtn'+(cur===pair[0]?' on':''),pair[1]);
      b.style.padding='8px 12px';b.style.fontSize='12px';

        b.classList.add('on');load();
      };
      periodRow.appendChild(b);
    });
    p.appendChild(periodRow);
    p.appendChild(funnelBox);
    p.appendChild(seg);
    Object.keys(bodies).forEach(function(k){p.appendChild(bodies[k]);});
    load();
  }

        box.appendChild(moreBtn);

  function uploadPhotoFor(itemId){

  // Same compression discipline as the APK: max 1080px, JPEG q0.8
  // (~150–250KB — light for merchants on mobile data).
  function compressImage(file,cb){
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      var MAX=1080;
      var sc=Math.min(1,MAX/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc));
      cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cb(cv.toDataURL('image/jpeg',0.8).split(',')[1]);
    };
    img.onerror=function(){URL.revokeObjectURL(url);};
    img.src=url;
  }

            .then(function(k){ if(!k.ok){err.textContent=L.errGeneric+'  ⓘ '+(k.error||'photo');} finish(); })
            .catch(function(){finish();});
        }else{finish();}
      }).catch(function(){btn.disabled=false;btn.textContent=L.saveItemBtn;err.textContent=L.errGeneric;});
    };
    p.appendChild(btn);
    c.appendChild(p);
  }

  // Mark-as-sold sheet: size → qty → amount → channel → sales row +
  // stock drop (the shop must never lie about availability).
  function renderSoldSheet(item){
    window.__mode='sold';
    var c=content();c.innerHTML='';
    document.getElementById('storeName').textContent=L.soldTitle;
    document.getElementById('storeSub').textContent=item.name;
    setLogo(null);
    var p=el('div','panel');
    var back=el('button','mbtn back',detectCur()==='am'?'‹ ተመለስ':'‹ Back');
    back.onclick=function(){renderOwner(window.__ownerStore);};
    p.appendChild(back);
    p.appendChild(el('h2',null,L.soldTitle+' — '+item.name));

    // ALL sizes with their counts — including 0 — so the section is
    // never empty and recording an unlisted sale stays possible
    // (stock decrements floor at 0; truth beats bookkeeping).
    var avail=item.sizes.slice();
    var chosenSize=avail.length===1?avail[0]:null;
    p.appendChild(el('h3',null,L.sizeL));
    var sizeLine=el('div','ir-sub');
    avail.forEach(function(s){
      var b=el('button','mbtn'+(chosenSize===s?' on':''),shortSize(s.label)+' ('+s.qty+')');
      b.onclick=function(){
        chosenSize=s;
        Array.prototype.forEach.call(sizeLine.children,function(x){x.classList.remove('on');});
        b.classList.add('on');
        recalc();
      };
      sizeLine.appendChild(b);
    });
    if(avail.length>1){sizeLine.appendChild(el('span','tier t-in','—'));}
    p.appendChild(sizeLine);

    var fq=el('div','field');fq.appendChild(el('label',null,L.qtyL));
    var iQty=document.createElement('input');iQty.inputMode='numeric';iQty.value='1';
    fq.appendChild(iQty);p.appendChild(fq);
    var fa=el('div','field');fa.appendChild(el('label',null,L.amountL));
    var iAmt=document.createElement('input');iAmt.inputMode='numeric';
    fa.appendChild(iAmt);p.appendChild(fa);
    function recalc(){
      var q=Math.max(1,Math.floor(Number(iQty.value||1)));
      iAmt.value=(q*Number(item.sell_price||0)).toString();
    }
    iQty.oninput=recalc;
    recalc();

    p.appendChild(el('h3',null,L.payChL));
    var channel='telebirr';
    var chLine=el('div','ir-sub');
    [['telebirr',detectCur()==='am'?'ቴሌብር':'Telebirr'],['cbe','CBE'],['cash',detectCur()==='am'?'ጥሬ ገንዘብ':'Cash']].forEach(function(pair,i){
      var b=el('button','mbtn'+(i===0?' on':''),pair[1]);
      b.onclick=function(){
        channel=pair[0];
        Array.prototype.forEach.call(chLine.children,function(x){x.classList.remove('on');});
        b.classList.add('on');
      };
      chLine.appendChild(b);
    });
    p.appendChild(chLine);

    var err=el('div','err');p.appendChild(err);
    var okm=el('div','okmsg');p.appendChild(okm);
    var btn=el('button','btn',L.markBtn);
    btn.onclick=function(){
      err.textContent='';okm.textContent='';
      var qty=Math.floor(Number(iQty.value||0));
      if(chosenSize===null&&avail.length>1){err.textContent=L.sizeL+'?';return;}
      if(qty<1){err.textContent=L.errSoldQty;return;}
      btn.disabled=true;
      authCall('sale_mark',{
        item_id:item.id,
        size_slug:chosenSize?chosenSize.slug:undefined,
        qty:qty,amount:Number(iAmt.value||0),channel:channel
      }).then(function(j){
        btn.disabled=false;
        if(!j.ok){err.textContent=L.errGeneric+'  ⓘ '+errDetail(j);return;}
        okm.textContent=L.soldDone;
        setTimeout(function(){renderOwner(window.__ownerStore);},800);
      }).catch(function(){btn.disabled=false;err.textContent=L.errGeneric;});
    };
    p.appendChild(btn);
    c.appendChild(p);
  }

  function detectCur(){return document.getElementById('langAm').className.indexOf('on')>=0?'am':'en';}

  function renderHome(){
    window.__mode='home';
    var c=content();c.innerHTML='';
    if(!initDataOK()){
      document.getElementById('storeName').textContent='Adulis';
      document.getElementById('storeSub').textContent=L.appSub;
      renderCreate();return;
    }
    c.appendChild(el('div','state',L.signin));
    var lastCode='';
    authCall('signin',{initData:tg.initData})
      .then(function(j){
        lastCode=errDetail(j);
        if(j.needsSignup){renderCreate();return;}
        if(j.code_required){
          renderCodeStep(function(code){
            return authCall('signin',{initData:tg.initData,code:code});
          },function(k){
            renderOwner({name:k.name,slug:k.slug});
          });
          return;
        }
        if(!(j.ok&&(j.access_token||j.token_hash))) throw new Error(j.error||'x');
        return takeSession(j).then(function(ok){
          if(!ok)throw new Error(j.error||'session');
          renderOwner({name:j.name,slug:j.slug});
        });
      })
      .catch(function(e){
        var cc=content();cc.innerHTML='';
        var st=el('div','state',L.errGeneric);
        var d=el('div','err','ⓘ '+(lastCode||e.message||'network'));d.style.marginTop='8px';
        st.appendChild(d);
        if(/bad_init_data/.test(lastCode))diagButton(st);
        var b=el('button',null,L.retry);b.onclick=location.reload;
        st.appendChild(document.createElement('br'));st.appendChild(b);cc.appendChild(st);
      });
  }

  // ---- Routing ----
  function route(){
    killTabBar();
    var cf=document.getElementById('cartfab');if(cf)cf.remove();
    if(slug){window.__mode='shop';document.getElementById('storeName').textContent='…';loadShop();}
    else if(mode==='create'){renderCreate();}
    else if(mode==='home'){renderHome();}
    else{renderHome();}
  }
  setLang(saved);
  route();
})();
</script>
</body>
</html>
